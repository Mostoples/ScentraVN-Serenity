<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Medical / Meditation Dashboard</title>

<!-- Font modern sans-serif (fallback aman jika offline) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  /* =========================================================
     DESIGN TOKENS — ubah di sini untuk kustomisasi cepat
     ========================================================= */
  :root {
    --teal:        #18d8c6;   /* segmen normal */
    --teal-deep:   #0fae9f;
    --red:         #ff3a57;   /* segmen peringatan/fokus */
    --red-soft:    #ff5e75;
    --ink:         #ffffff;   /* teks */
    --ring-bg:     #0c2336;   /* isi lingkaran baterai */
    --card-r:      28px;      /* radius sudut kartu */
    --ease:        cubic-bezier(.4, 0, .2, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    font-family: "Poppins", "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  /* Panggung gelap di belakang komponen (opsional, untuk demo halaman) */
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #07101a;
  }

  /* =========================================================
     KOMPONEN UTAMA — .med-dashboard
     Sepenuhnya responsif (lebar mengikuti container, maks 560px)
     ========================================================= */
  .med-dashboard {
    position: relative;
    width: 100%;
    max-width: 560px;
    aspect-ratio: 1.4 / 1;
    border-radius: var(--card-r);
    overflow: hidden;
    isolation: isolate;
    color: var(--ink);

    /* 1. Latar gelap: gradasi ungu tua -> biru/toska gelap, + cahaya halus */
    background:
      radial-gradient(120% 90% at 14% 8%,  rgba(124, 64, 200, .35), transparent 52%),
      radial-gradient(95%  80% at 52% 42%, rgba(20, 200, 188, .14), transparent 60%),
      linear-gradient(155deg, #2c1556 0%, #1c1a4e 32%, #102a3e 72%, #0a2030 100%);
    box-shadow:
      0 30px 60px -25px rgba(0, 0, 0, .7),
      inset 0 1px 0 rgba(255, 255, 255, .06);
  }

  /* 1b. Garis gelombang dekoratif transparan */
  .waves {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* Area pengukur (busur) — ditempatkan agak ke atas-tengah */
  .gauge-wrap {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6% 8% 0;
  }
  .gauge { width: 80%; max-width: 380px; height: auto; overflow: visible; }

  /* 4. Teks sapaan kanan-bawah */
  .greeting {
    position: absolute;
    right: 8%;
    bottom: 7%;
    z-index: 2;
    margin: 0;
    font-size: clamp(18px, 4.5vw, 30px);
    font-weight: 500;
    letter-spacing: .2px;
    text-shadow: 0 2px 14px rgba(0, 0, 0, .35);
    animation: fadeUp 1s var(--ease) .5s both;
  }
  .greeting span { font-weight: 300; opacity: .82; }

  /* =========================================================
     ANIMASI
     ========================================================= */
  /* Segmen muncul satu per satu */
  .seg { opacity: 0; animation: segIn .55s var(--ease) forwards; }
  .seg:hover { /* interaksi halus saat hover */
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(1.05);
    transition: transform .25s var(--ease);
  }

  /* Bloom lembut seluruh pengukur saat dimuat */
  .gauge-reveal {
    transform-box: view-box;
    transform-origin: 200px 186px;
    animation: bloom 1s var(--ease) both;
  }

  /* Segmen merah berdenyut pelan (indikator fokus) */
  .seg--alert { animation: segIn .55s var(--ease) forwards, alertPulse 2.6s ease-in-out 1.1s infinite; }

  /* Detak hati */
  .heart {
    transform-box: fill-box;
    transform-origin: center;
    animation: fadeIn .4s ease 1s both, beat 1.8s ease-in-out 1.4s infinite;
  }

  .battery { animation: fadeIn .6s ease .35s both; }
  .battery__glow { animation: breathe 3.4s ease-in-out infinite; }

  @keyframes segIn      { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bloom      { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: scale(1); } }
  @keyframes fadeIn     { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeUp     { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes alertPulse { 0%, 100% { opacity: 1; } 50% { opacity: .72; } }
  @keyframes beat       { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.22); } 28% { transform: scale(1); } 42% { transform: scale(1.14); } 56% { transform: scale(1); } }
  @keyframes breathe    { 0%, 100% { opacity: .35; } 50% { opacity: .7; } }

  /* Hormati preferensi gerak pengguna */
  @media (prefers-reduced-motion: reduce) {
    *, .seg, .seg--alert, .heart, .battery, .battery__glow, .gauge-reveal, .greeting {
      animation: none !important;
    }
    .seg { opacity: 1; }
  }
</style>
</head>
<body>

  <!-- ====================== KOMPONEN ====================== -->
  <div class="med-dashboard" role="group" aria-label="Dashboard sensor — status baterai penuh, satu indikator fokus">

    <!-- Garis gelombang dekoratif -->
    <svg class="waves" viewBox="0 0 560 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <path d="M-40 120 C 120 40, 300 60, 620 -10" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="1.6"/>
      <path d="M-40 150 C 120 78, 320 96, 620 30"  fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1.2"/>
      <path d="M-60 360 C 160 320, 360 340, 640 280" fill="none" stroke="#4fd6e0" stroke-opacity=".06" stroke-width="1.4"/>
    </svg>

    <!-- Pengukur busur + baterai (digenerate oleh JS ke dalam SVG ini) -->
    <div class="gauge-wrap">
      <svg class="gauge" viewBox="0 0 400 330" role="img"
           aria-label="Pengukur dengan enam segmen, satu segmen merah sebagai peringatan">
        <defs>
          <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0"  stop-color="#28e7d4"/>
            <stop offset="1"  stop-color="#0fae9f"/>
          </linearGradient>
          <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff5e75"/>
            <stop offset="1" stop-color="#ff2742"/>
          </linearGradient>
          <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0"  stop-color="#18d8c6" stop-opacity=".55"/>
            <stop offset="1"  stop-color="#18d8c6" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <g class="gauge-reveal">
          <g id="segments"></g>
          <g id="battery"></g>
          <g id="heart-layer"></g>
        </g>
      </svg>
    </div>

    <!-- Sapaan -->
    <p class="greeting">Good <span>evening</span></p>
  </div>

<script>
/* =========================================================
   KONFIGURASI PENGUKUR — atur jumlah/warna/posisi dari sini
   ========================================================= */
const CFG = {
  cx: 200, cy: 186,          // pusat busur
  rInner: 80, rOuter: 132,   // radius dalam & luar
  startAngle: 232,           // sudut awal (derajat, 0°=kanan, CCW positif)
  endAngle: -52,             // sudut akhir → mulut busur menganga di bawah
  segments: 6,               // jumlah segmen
  gapDeg: 6,                 // jarak antar segmen (derajat)
  alertIndex: 3,             // segmen ke- (0-based) yang berwarna merah
};

const NS = "http://www.w3.org/2000/svg";

/* Konversi sudut polar -> titik layar (y dibalik agar 90°=atas) */
function polar(cx, cy, r, deg) {
  const a = (deg * Math.PI) / 180;
  return [cx + r * Math.cos(a), cy - r * Math.sin(a)];
}

/* Path sektor cincin dari sudut a1 (besar) ke a2 (kecil) */
function ringSector(cx, cy, rI, rO, a1, a2) {
  const [x1, y1] = polar(cx, cy, rO, a1);
  const [x2, y2] = polar(cx, cy, rO, a2);
  const [x3, y3] = polar(cx, cy, rI, a2);
  const [x4, y4] = polar(cx, cy, rI, a1);
  const large = a1 - a2 > 180 ? 1 : 0;
  return `M ${x1} ${y1} A ${rO} ${rO} 0 ${large} 1 ${x2} ${y2} `
       + `L ${x3} ${y3} A ${rI} ${rI} 0 ${large} 0 ${x4} ${y4} Z`;
}

function el(name, attrs) {
  const n = document.createElementNS(NS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

/* ----------------------- Bangun segmen ----------------------- */
(function buildSegments() {
  const g = document.getElementById("segments");
  const sweep  = CFG.startAngle - CFG.endAngle;
  const segW   = (sweep - CFG.gapDeg * (CFG.segments - 1)) / CFG.segments;
  let a = CFG.startAngle;
  let alertA1 = null;        // simpan tepi atas segmen merah (untuk hati)

  for (let i = 0; i < CFG.segments; i++) {
    const a1 = a;
    const a2 = a - segW;
    const isAlert = i === CFG.alertIndex;
    if (isAlert) alertA1 = a1;

    const p = el("path", {
      d: ringSector(CFG.cx, CFG.cy, CFG.rInner, CFG.rOuter, a1, a2),
      fill: isAlert ? "url(#redGrad)" : "url(#tealGrad)",
      stroke: isAlert ? "var(--red)" : "var(--teal)",
      "stroke-width": 4,
      "stroke-linejoin": "round",
      "stroke-linecap": "round",
    });
    p.setAttribute("class", "seg" + (isAlert ? " seg--alert" : ""));
    p.style.animationDelay = (0.45 + i * 0.08) + "s";
    p.style.filter = isAlert
      ? "drop-shadow(0 0 12px rgba(255,58,87,.75))"
      : "drop-shadow(0 0 7px rgba(24,216,198,.45))";
    g.appendChild(p);

    a = a2 - CFG.gapDeg;
  }

  /* --------------------- Ikon hati di ujung atas segmen merah --------------------- */
  if (alertA1 !== null) {
    const [hx, hy] = polar(CFG.cx, CFG.cy, CFG.rOuter + 11, alertA1);
    const s = 0.9;
    const layer = document.getElementById("heart-layer");
    const heart = el("path", {
      d: "M12 21 C12 21 4 13.6 4 8.6 C4 5.9 6 4 8.3 4 C9.9 4 11.2 5 12 6.3 "
       + "C12.8 5 14.1 4 15.7 4 C18 4 20 5.9 20 8.6 C20 13.6 12 21 12 21 Z",
      fill: "url(#redGrad)",
      stroke: "var(--red-soft)",
      "stroke-width": 1,
    });
    heart.setAttribute("class", "heart");
    heart.setAttribute("transform", `translate(${hx - 12 * s} ${hy - 12 * s}) scale(${s})`);
    heart.style.filter = "drop-shadow(0 0 8px rgba(255,58,87,.85))";
    layer.appendChild(heart);
  }
})();

/* ----------------------- Indikator baterai di tengah ----------------------- */
(function buildBattery() {
  const bx = CFG.cx, by = CFG.cy + 6, R = 46;
  const g = document.getElementById("battery");
  g.setAttribute("class", "battery");

  g.appendChild(el("circle", { class: "battery__glow", cx: bx, cy: by, r: R + 6, fill: "url(#ringGlow)" }));
  g.appendChild(el("circle", { cx: bx, cy: by, r: R, fill: "var(--ring-bg)", stroke: "#ffffff", "stroke-width": 3.5 }));

  // Badan baterai (horizontal)
  g.appendChild(el("rect", {
    x: bx - 24, y: by - 13, width: 46, height: 26, rx: 5,
    fill: "none", stroke: "var(--teal)", "stroke-width": 3,
  }));
  // Terminal kanan
  g.appendChild(el("rect", { x: bx + 24, y: by - 6, width: 5, height: 12, rx: 2, fill: "var(--teal)" }));
  // Tiga bar penuh
  [-18, -5, 8].forEach((dx) =>
    g.appendChild(el("rect", { x: bx + dx, y: by - 8, width: 10, height: 16, rx: 2, fill: "var(--teal)" }))
  );
})();
</script>
</body>
</html>
